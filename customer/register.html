<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer register</title><link rel="stylesheet" href="../css/base.css"></head><body data-auth-page="true" data-role="customer" data-mode="register"><main class="auth-page"><div class="auth-wrap"><p class="auth-brand">Malabar Bites</p><section class="card auth-card"><p class="caption">CUSTOMER</p><h1 class="page-title">Create account</h1><p class="page-subtitle"><span data-restaurant-name></span></p><form data-auth-form novalidate><div class="field"><label for="name">Name</label><input class="input" id="name" name="name" placeholder="Your name" autocomplete="name"><small class="field-error"></small></div><div class="field"><label for="mobile">Mobile number</label><input class="input" id="mobile" name="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" autocomplete="tel"><small class="field-error"></small></div><div class="field"><label for="referralCode">Referral code <span class="muted">(optional)</span></label><input class="input" id="referralCode" name="referralCode" placeholder="ABC1234" maxlength="7"><small class="field-error"></small></div><button class="btn btn-primary" type="submit">Send OTP</button></form><p class="caption hidden" data-existing>Mobile already registered. <a href="login.html" style="color:var(--accent);font-weight:700">Login</a></p><p class="auth-footer">Already registered? <a href="login.html">Login</a></p></section></div></main><script src="../js/utils.js"></script><script src="../js/mock-data.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script></body></html>
