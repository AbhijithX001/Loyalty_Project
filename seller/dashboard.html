<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seller dashboard</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/seller.css">
</head>
<body data-seller-dashboard="true">
  <aside class="sidebar" id="desktop-nav">
    <div class="sidebar-brand" data-restaurant-name></div>
    <button class="nav-item active" data-view="overview"><span data-icon="home"></span><span>Overview</span></button>
    <button class="nav-item" data-view="billing"><span data-icon="receipt"></span><span>Billing</span></button>
    <button class="nav-item" data-view="customers"><span data-icon="users"></span><span>Customers</span></button>
    <button class="nav-item" data-view="menu"><span data-icon="tag"></span><span>Menu</span></button>
    <button class="nav-item" data-view="loyalty"><span data-icon="gift"></span><span>Loyalty</span></button>
    <button class="nav-item" data-view="marketing"><span data-icon="tag"></span><span>Marketing</span></button>
    <button class="nav-item" data-view="redemptions"><span data-icon="check"></span><span>Redemptions</span></button>
    <button class="nav-item" data-view="referrals"><span data-icon="users"></span><span>Referrals</span></button>
    <button class="nav-item" data-view="reports"><span data-icon="chart"></span><span>Reports</span></button>
    <button class="nav-item" data-view="qr"><span data-icon="qr"></span><span>QR code</span></button>
  </aside>
  <main class="page seller-main">
    <header class="page-header"><p class="caption" data-restaurant-name></p><h1 class="page-title" data-page-title>Overview</h1><p class="page-subtitle" data-page-subtitle></p></header>
    <div id="seller-content"><div class="skeleton" style="height:180px"></div></div>
  </main>
  <nav class="bottom-nav" id="mobile-nav">
    <button class="nav-item active" data-view="overview" aria-label="Overview"><span data-icon="home"></span><span>Overview</span></button>
    <button class="nav-item" data-view="billing" aria-label="Billing"><span data-icon="receipt"></span><span>Billing</span></button>
    <button class="nav-item" data-view="customers" aria-label="Customers"><span data-icon="users"></span><span>Customers</span></button>
    <button class="nav-item" data-view="redemptions" aria-label="Redemptions"><span data-icon="check"></span><span>Redemptions</span></button>
    <button class="nav-item" data-more aria-label="More"><span data-icon="more"></span><span>More</span></button>
  </nav>
  <button class="fab" data-view="billing" aria-label="New bill" data-icon="plus"></button>
  <div class="sheet-backdrop" id="more-sheet"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="more-title"><div class="sheet-handle"></div><button class="icon-btn" data-close-sheet aria-label="Close more menu" style="float:right" data-icon="x"></button><h2 class="sheet-title" id="more-title">More</h2><div class="more-list"><button class="btn btn-ghost" data-view="menu"><span data-icon="tag"></span>Menu</button><button class="btn btn-ghost" data-view="loyalty"><span data-icon="gift"></span>Loyalty</button><button class="btn btn-ghost" data-view="marketing"><span data-icon="tag"></span>Marketing</button><button class="btn btn-ghost" data-view="referrals"><span data-icon="users"></span>Referrals</button><button class="btn btn-ghost" data-view="reports"><span data-icon="chart"></span>Reports</button><button class="btn btn-ghost" data-view="qr"><span data-icon="qr"></span>QR code</button><button class="btn btn-ghost" data-logout><span data-icon="logout"></span>Logout</button></div></section></div>
  <div class="sheet-backdrop" id="customer-sheet"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="customer-sheet-title"><div class="sheet-handle"></div><button class="icon-btn" data-close-sheet aria-label="Close customer details" style="float:right" data-icon="x"></button><h2 class="sheet-title" id="customer-sheet-title">Customer</h2><div id="customer-detail"></div></section></div>
  <div class="sheet-backdrop" id="bill-preview-sheet"><section class="sheet bill-preview-sheet" role="dialog" aria-modal="true" aria-labelledby="bill-preview-title"><div class="sheet-handle"></div><button class="icon-btn" data-close-sheet aria-label="Close bill preview" style="float:right" data-icon="x"></button><h2 class="sheet-title" id="bill-preview-title">Review Bill</h2><p class="muted">Check the order details before generating the bill.</p><div id="bill-preview-detail"></div></section></div>
  <div id="toast" class="toast"></div>
  <script src="../js/icons.js"></script><script src="../js/utils.js"></script><script src="../js/mock-data.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script><script src="../js/seller.js"></script><script>initSellerDashboard();</script>
</body>
</html>
